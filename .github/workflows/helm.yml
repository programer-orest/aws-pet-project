name: Helm-CI

on:
  workflow_run:
    workflows: ["App-CI"]
    types: ["completed"]
    branches: ["develop"]
  pull_request:
    branches: ["main"]


permissions:
  contents: read


env:
  CHART_PATH: ./aws-pet-project-charts/todoapp
  APP_NS: todoapp

jobs:
  helm-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Package Helm Chart
        run: helm package ${{ env.CHART_PATH }} -d ./artifacts

      - name: Login to DockerHub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Push Helm Chart
        run: |
          DOCKER_USER_LOWER=$(echo "${{ secrets.DOCKERHUB_USERNAME }}" | tr '[:upper:]' '[:lower:]')
          FILE=$(ls ./artifacts/*.tgz | head -n1)
          echo "Pushing $FILE to oci://docker.io/${{ secrets.DOCKERHUB_USERNAME }}/charts"
          helm push $FILE oci://docker.io/$DOCKER_USER_LOWER/charts


      - name: Lint Helm Chart
        run: helm lint ${{ env.CHART_PATH }}


      - name: Render chart
        run: helm template test "${CHART_PATH}" >/dev/null

