apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ .Chart.Name }}-hpa
  namespace: {{ .Values.common.namespace }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Chart.Name }}-deployment
  minReplicas: {{ .Values.todoapp.hpa.minReplicas }}
  maxReplicas: {{ .Values.todoapp.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: {{ .Values.todoapp.hpa.cpu.type}}
          averageUtilization: {{ .Values.todoapp.hpa.cpu.averageUtilization }}
    - type: Resource
      resource:
        name: memory
        target:
          type: {{ .Values.todoapp.hpa.memory.type }}
          averageUtilization: {{ .Values.todoapp.hpa.memory.averageUtilization }}